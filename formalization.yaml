automation:
  methods:
    - method: "agent"
      models:
        - "claude-fable-5-1"
        - "gpt-5.6-luna"
        - "gpt-6-astra"
        - "deepseek-4.1-flash"
        - "leanstral-1-5"
        - "claude-opus-5"
      framework: >-
        Claude Fable 5.1 coordinated work using GPT 5.6-Luna, GPT Astra,
        Deepseek 4.1 flash, Leanstral and Opus 5, under the authors' supervision.
        The Leray existence development was written in the Escauriaza-Seregin-Sverak
        formalization (2026-09-26 to 2026-09-29; Claude Opus 5.5 coordinating
        GPT-6 Luna and GPT-6 Sol) and transferred here on 2026-09-29. The transfer
        and the port of the whole library to Lean's module system were done with
        Claude Sonnet 5.5 coordinated by Claude Opus 5.5.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2. The main theorem statements were reviewed
        before proof development. Verification uses source checks, builds of
        all library modules, Mathlib-only comparator statements and solutions,
        independent NanoDa replay, and axiom checks. The commands are documented in
        docs/VERIFICATION.md and run by the repository's CI workflows.
      cost:
        wall_time: "roughly 48 hours of development plus one day of release preparation; the Leray existence part was developed in the Escauriaza-Seregin-Sverak formalization development (2026-09-26 to 2026-09-29) and moved into this library on 2026-09-29"
        spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "one 16-CPU / 124 GB RAM Linux machine"
      prompting_notes: >-
        The authors determined the mathematical statements and reviewed changes
        to the manuscript. Separate reviews compared the formal statements with
        the manuscript and checked the use of intermediate results in the proofs.

  spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of the
    authors, who decided the mathematics, the statements and the corrections to
    the manuscript. Every proof is checked by the Lean kernel and Mathlib; the
    library contains no sorry and no custom axiom. The Mathlib-only comparators/Challenge.lean contains exactly three intentional
    theorem-body placeholders. The separate Solution.lean proves the same
    named declarations from the library; comparator.json selects all three.
    A second pair, comparators/Leray/{Challenge,Solution}.lean, has five
    placeholders, one for each of the Leray existence and pressure theorems
    except CKN.associatedPressureForced (whose pressure split by Riesz-type
    operators would have to be defined from Mathlib inside the challenge; no
    concise restatement was attempted within the 1,000-line limit);
    comparators/Leray/comparator.json selects its five declarations. The
    Leray part of the library was written in the Escauriaza-Seregin-Sverak
    formalization under the same supervision and transferred here on
    2026-09-29; those files keep the copyright line "Scott Armstrong."

fidelity:
  divergences: >-
    Recorded in docs/DEVIATIONS.md and docs/DESIGN_NOTES.md. The main ones:
    solutions live on open product domains in space-time (no loss by locality);
    the local energy inequality is used in its almost-every-time form and the
    manuscript's every-time route is excluded; the singular set is measured with
    the parabolic diameter gauge, whose null sets coincide with those of the
    manuscript's radius gauge; the Leray solutions are built by a Fourier L^2
    regularization rather than the Oseen-kernel route, the associated pressure
    is the whole-space double Riesz transform with a fixed sign, and a
    Leray-Hopf solution is one specified function whose every time slice is
    constrained (weak continuity on the closed interval, the energy
    inequality at every time, the strong initial trace); the bootstrap step of the manuscript was rewritten
    to follow the formalized route (a localized pressure-gradient Morrey bound
    rather than a pointwise potential representation); the Hölder representative
    is constructed as a limit of dyadic ball averages rather than by
    mollification; the common exceptional time set for the pressure slice
    identity is obtained by translated mollifier tests rather than a countable
    dense family of test functions; Theorem A asserts regularity on the open
    interior of the half-cylinder, not on its top time face; the force is
    assumed in L^q_loc with q > 5/2, which is stronger than the weakest known
    hypotheses. The solution predicate uses supremum-norm energy finiteness,
    equivalent to Euclidean finiteness in the fixed finite-dimensional spaces.
    The nine main conclusions agree with the manuscript; supporting statement
    differences and unused exposition are described in the linked documents.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Vlad Vicol"
  notes: >-
    Lean checks each proof against its formal statement. The
    authors reviewed that the statements are the intended theorems; the
    statements were compared with the manuscript by independent read-only
    reviews, including a GPT-6 Sol audit, the eight comparator declarations are checked mechanically, and the
    manuscript was proofread in full before release. This is not external peer
    review.

alignment:
  namespace: "CKN"
  statements:
    - source: "Theorem 2.7 (thm:A), small-data regularity"
      lean: "CKN.epsilonRegularityL3"
      module: "CKN.Statements.TheoremA"
      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Theorem 2.9 (thm:B), gradient regularity"
      lean: "CKN.epsilonRegularityGradient"
      module: "CKN.Statements.TheoremB"
      status: "proved"
      note: "Comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Theorem 2.10 (thm:C), partial regularity"
      lean: "CKN.caffarelliKohnNirenberg"
      module: "CKN.Statements.TheoremC"
      status: "proved"
      note: "Deduced from Theorem B by the parabolic Vitali covering argument; comparator pair comparators/{Challenge,Solution}.lean."
    - source: "Theorem thm:leray, Leray existence in suitable form (new part of the manuscript on global existence)"
      lean: "CKN.leray_existence"
      module: "CKN.Statements.LerayExistence"
      status: "proved"
      note: "Comparator pair comparators/Leray/{Challenge,Solution}.lean. The conclusion is literally CKN.IsSuitableWeakSolution on R^3 x (0, infinity) for every q > 5/2, with zero force."
    - source: "Corollary cor:ckn-headline, the singular set of Leray's solution (new part of the manuscript on global existence)"
      lean: "CKN.leray_existence_singularSet"
      module: "CKN.Statements.LerayExistenceSingularSet"
      status: "proved"
      note: "Comparator pair comparators/Leray/{Challenge,Solution}.lean. Composes the existence theorem with CKN.caffarelliKohnNirenberg."
    - source: "Theorem thm:assoc-pressure, associated pressure (new part of the manuscript on global existence)"
      lean: "CKN.associatedPressure"
      module: "CKN.Statements.AssociatedPressure"
      status: "proved"
      note: "Comparator pair comparators/Leray/{Challenge,Solution}.lean. Includes the conditional L^infinity L^{3/2} bound under the critical velocity bound."
    - source: "Theorem thm:leray-forced, forced suitable existence (new part of the manuscript on global existence)"
      lean: "CKN.lerayExistenceForced"
      module: "CKN.Statements.LerayExistenceForced"
      status: "proved"
      note: "Comparator pair comparators/Leray/{Challenge,Solution}.lean. One solution is suitable for every q > 5/2 at which the force is locally L^q."
    - source: "Theorem thm:leray-forced-singularSet, forced singular set (new part of the manuscript on global existence)"
      lean: "CKN.lerayExistenceForcedSingularSet"
      module: "CKN.Statements.LerayExistenceForcedSingularSet"
      status: "proved"
      note: "Comparator pair comparators/Leray/{Challenge,Solution}.lean. "
    - source: "Theorem thm:assoc-pressure-forced, forced associated pressure (new part of the manuscript on global existence)"
      lean: "CKN.associatedPressureForced"
      module: "CKN.Statements.AssociatedPressureForced"
      status: "proved"
      note: "The pressure split through the Riesz operators. Proved; not restated in a comparator, because its pressure split by Riesz-type operators would have to be defined from Mathlib inside the challenge; no concise restatement was attempted within the 1,000-line challenge limit."
    - source: "Existence of a nonzero suitable weak solution (viscous shear flow)"
      lean: "CKN.isSuitableWeakSolutionIntegrable_shearFlow"
      module: "CKN.Setting.Examples.ShearFlowSuitable"
      status: "proved"
      note: "An explicit nonzero example; CKN.leray_existence shows the solution class is non-empty for every divergence-free L^2 datum. See docs/WITNESSES.md."

